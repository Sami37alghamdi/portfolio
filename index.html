<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامي الغامدي - محفظة انجاز</title>

    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Shared Custom CSS -->
    <link rel="stylesheet" href="style.css?v=9">

    <!-- Chart.js (Loaded globally for now to ensure Nafes works smoothly) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        light: { main: '#ffffff', surface: '#f8fafc', text: '#1e293b' },
                        dark: { main: '#0f172a', surface: '#1e293b', text: '#f8fafc' },
                        brand: { lightPrimary: '#0f766e', darkPrimary: '#2dd4bf', secondary: '#fbbf24' }
                    },
                    boxShadow: { 'glass': '0 4px 30px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
</head>

<body id="page-home"
    class="bg-light-main dark:bg-dark-main text-light-text dark:text-dark-text font-sans antialiased transition-colors duration-500 math-bg min-h-screen flex flex-col disable-tap-highlight overflow-x-hidden">

    <!-- Sticky Top Header (Icons Only) -->
    <header
        class="fixed top-0 left-0 right-0 z-50 glassmorphism px-4 py-3 flex justify-between items-center w-full max-w-3xl mx-auto rounded-b-3xl">
        <div class="flex flex-col items-start leading-tight">
            <span class="text-lg font-extrabold text-slate-800 dark:text-white"
                style="font-family:'Tajawal',sans-serif">سامي الغامدي</span>
            <span class="text-xs font-bold text-brand-lightPrimary dark:text-brand-darkPrimary"
                style="font-family:'Tajawal',sans-serif">أبعاد التميز</span>
        </div>
        <div class="flex gap-3 items-center">
            <button id="themeToggleBtn"
                class="text-2xl text-brand-lightPrimary dark:text-brand-darkPrimary hover:scale-110 transition-transform focus:outline-none hover-shake"
                aria-label="تبديل المظهر">
                <i class="fa-solid fa-moon dark:hidden transition-opacity duration-300"></i>
                <i class="fa-solid fa-sun hidden dark:inline-block transition-opacity duration-300"></i>
            </button>
            <a href="admin.html"
                class="text-xl text-gray-400 dark:text-gray-500 hover:text-brand-lightPrimary dark:hover:text-brand-darkPrimary hover:scale-110 transition-transform focus:outline-none hover-shake"
                aria-label="لوحة التحكم">
                <i class="fa-solid fa-gear"></i>
            </a>
            <a href="contact.html" id="contactBtnDesktop"
                class="bg-brand-lightPrimary dark:bg-brand-darkPrimary text-white dark:text-dark-main px-3 py-1.5 rounded-2xl shadow-md hover:shadow-lg hover:scale-105 transition-all text-sm font-bold flex items-center gap-1.5 hover-shake"
                aria-label="تواصل">
                <i class="fa-solid fa-envelope text-base"></i>
                تواصل معي
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-24 pb-28 px-4 w-full max-w-3xl mx-auto relative content-fade-in">
        <!-- Loader during fetch -->
        <div id="loader" class="flex justify-center items-center h-64">
            <i
                class="fa-solid fa-circle-notch fa-spin text-4xl text-brand-lightPrimary dark:text-brand-darkPrimary"></i>
        </div>

        <!-- Injected Content Container -->
        <div id="pageContent" class="hidden flex-col gap-6"></div>
    </main>

    <!-- Fixed Bottom App-like Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 z-50 glassmorphism-bottom pb-safe pt-2 px-2 w-full max-w-3xl mx-auto rounded-t-3xl shadow-[0_-4px_25px_rgba(0,0,0,0.05)] dark:shadow-[0_-4px_25px_rgba(0,0,0,0.2)]">
        <ul class="flex justify-between items-center text-xs sm:text-sm">
            <li class="flex-1 text-center">
                <a href="index.html"
                    class="nav-btn w-full flex flex-col items-center gap-1 py-2 text-gray-500 hover:text-brand-lightPrimary transition-colors active">
                    <i class="fa-solid fa-house text-xl mb-1 nav-icon transition-transform"></i>
                    <span class="font-bold">الرئيسية</span>
                </a>
            </li>
            <li class="flex-1 text-center">
                <a href="evidence.html"
                    class="nav-btn w-full flex flex-col items-center gap-1 py-2 text-gray-500 hover:text-brand-lightPrimary transition-colors">
                    <i class="fa-regular fa-folder-open text-xl mb-1 nav-icon transition-transform"></i>
                    <span class="font-bold">الشواهد</span>
                </a>
            </li>
            <li class="flex-1 text-center">
                <a href="math-lab.html"
                    class="nav-btn w-full flex flex-col items-center gap-1 py-2 text-gray-500 hover:text-brand-lightPrimary transition-colors">
                    <i class="fa-solid fa-square-root-variable text-xl mb-1 nav-icon transition-transform"></i>
                    <span class="font-bold">المعمل</span>
                </a>
            </li>
            <li class="flex-1 text-center">
                <a href="nafes.html"
                    class="nav-btn w-full flex flex-col items-center gap-1 py-2 text-gray-500 hover:text-brand-lightPrimary transition-colors">
                    <i class="fa-solid fa-chart-line text-xl mb-1 nav-icon transition-transform"></i>
                    <span class="font-bold">نافس</span>
                </a>
            </li>
            <li class="flex-1 text-center">
                <a href="honor-roll.html"
                    class="nav-btn w-full flex flex-col items-center gap-1 py-2 text-gray-500 hover:text-brand-lightPrimary transition-colors">
                    <i class="fa-solid fa-medal text-xl mb-1 nav-icon transition-transform"></i>
                    <span class="font-bold">الشرف</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Modals Overlay -->
    <div id="modalOverlay"
        class="fixed inset-0 bg-black/50 z-[60] hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm flex items-center justify-center p-4">

        <!-- Contact Modal -->
        <div id="contactModal"
            class="bg-light-main dark:bg-dark-main w-full max-w-md rounded-3xl p-6 shadow-2xl transform scale-95 opacity-0 transition-all duration-300 hidden flex flex-col gap-6 relative">
            <button
                class="close-modal absolute top-4 left-4 text-gray-400 hover:text-red-500 transition-colors text-2xl"><i
                    class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-bold text-center text-brand-lightPrimary dark:text-brand-darkPrimary">تواصل معي
            </h2>
            <p class="text-center text-gray-600 dark:text-gray-300">يسعدني تواصلكم عبر القنوات التالية:</p>
            <div class="flex flex-col gap-4 mt-2 mb-4" id="contactLinksContainer">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Personal Info Modal (نبذة عني) -->
        <div id="personalInfoModal"
            class="bg-light-main dark:bg-dark-main w-full max-w-md rounded-3xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300 hidden flex flex-col relative overflow-hidden">
            <button
                class="close-modal absolute top-4 left-4 z-10 text-gray-400 hover:text-red-500 transition-colors text-2xl"><i
                    class="fa-solid fa-xmark"></i></button>
            <!-- Header gradient -->
            <div
                class="bg-gradient-to-bl from-teal-600 to-emerald-800 p-6 pt-8 pb-10 text-white relative overflow-hidden">
                <div class="absolute inset-0 opacity-10"
                    style="background-image:url('data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' viewBox=\'0 0 40 40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ctext x=\'5\' y=\'18\' fill=\'white\' font-size=\'14\'%3Eπ%3C/text%3E%3Ctext x=\'22\' y=\'35\' fill=\'white\' font-size=\'14\'%3E∑%3C/text%3E%3C/svg%3E')">
                </div>
                <div class="relative z-10 flex items-center gap-4">
                    <div
                        class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center shadow-lg shrink-0">
                        <i class="fas fa-user-tie text-3xl text-white"></i>
                    </div>
                    <div>
                        <h2 id="pi_name" class="text-xl font-black text-white leading-tight"></h2>
                        <p id="pi_job" class="text-teal-200 text-sm font-semibold mt-0.5"></p>
                    </div>
                </div>
            </div>
            <!-- Info cards -->
            <div class="p-5 flex flex-col gap-3 max-h-[60vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 dark:bg-gray-800 rounded-2xl p-3">
                        <p class="text-xs text-gray-400 font-bold mb-1"><i
                                class="fa-solid fa-book-open ml-1 text-teal-500"></i>التخصص</p>
                        <p id="pi_specialty" class="text-sm font-black text-gray-800 dark:text-white"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800 rounded-2xl p-3">
                        <p class="text-xs text-gray-400 font-bold mb-1"><i
                                class="fa-solid fa-layer-group ml-1 text-teal-500"></i>المرحلة</p>
                        <p id="pi_stage" class="text-sm font-black text-gray-800 dark:text-white"></p>
                    </div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-800 rounded-2xl p-3">
                    <p class="text-xs text-gray-400 font-bold mb-1"><i
                            class="fa-solid fa-school ml-1 text-teal-500"></i>المدرسة</p>
                    <p id="pi_school" class="text-sm font-black text-gray-800 dark:text-white"></p>
                </div>
                <div class="grid grid-cols-1 gap-3">
                    <a id="modal-wa-link" href="#" target="_blank"
                        class="flex items-center gap-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-700 rounded-2xl p-3 hover:bg-green-100 transition-colors">
                        <div class="w-9 h-9 rounded-xl bg-green-500 flex items-center justify-center shrink-0">
                            <i class="fab fa-whatsapp text-white text-lg"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 font-bold">واتساب / هاتف</p>
                            <p id="pi_phone" class="text-sm font-black text-gray-800 dark:text-white" dir="ltr"></p>
                        </div>
                    </a>
                    <a id="pi_email_link" href="#"
                        class="flex items-center gap-3 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700 rounded-2xl p-3 hover:bg-blue-100 transition-colors">
                        <div class="w-9 h-9 rounded-xl bg-blue-500 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-envelope text-white"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 font-bold">البريد الإلكتروني</p>
                            <p id="pi_email" class="text-sm font-black text-gray-800 dark:text-white break-all"
                                dir="ltr"></p>
                        </div>
                    </a>
                </div>
                <!-- Certificate links -->
                <div id="pi_certs_section" class="hidden flex flex-col gap-2">
                    <p class="text-xs text-gray-400 font-bold mt-1"><i
                            class="fa-solid fa-certificate ml-1 text-amber-500"></i>الشهادات والرخص</p>
                    <a id="pi_license_btn" href="#" target="_blank"
                        class="hidden flex items-center gap-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-600 rounded-2xl p-3 hover:bg-amber-100 transition-colors">
                        <i class="fa-solid fa-id-card text-amber-500 text-xl w-8 text-center shrink-0"></i>
                        <span class="text-sm font-bold text-gray-700 dark:text-gray-200">رخصة المعلم</span>
                    </a>
                    <a id="pi_cert_btn" href="#" target="_blank"
                        class="hidden flex items-center gap-2 bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-600 rounded-2xl p-3 hover:bg-purple-100 transition-colors">
                        <i class="fa-solid fa-graduation-cap text-purple-500 text-xl w-8 text-center shrink-0"></i>
                        <span class="text-sm font-bold text-gray-700 dark:text-gray-200">الشهادة العلمية</span>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Supabase SDK & Shared JS -->
    <script src="app.js?v=10"></script>
</body>

</html>
